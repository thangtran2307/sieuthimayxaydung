<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập — MayXayDung</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="grid lg:grid-cols-2 min-h-screen">
  <!-- brand side -->
  <div class="relative hidden lg:flex flex-col justify-between p-12 text-white overflow-hidden" style="background:linear-gradient(160deg,#0f172a,#1e3a5f)">
    <div aria-hidden="true" style="position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:44px 44px;"></div>
    <a href="index.html" class="relative brand-mark" style="color:#fff"><span class="brand-logo"><i data-lucide="hard-hat" class="w-5 h-5"></i></span>MayXayDung</a>
    <div class="relative">
      <h2 class="text-4xl text-white leading-tight" data-i18n="hero.title">Mua bán máy móc & thiết bị xây dựng</h2>
      <p class="mt-4 max-w-md" style="color:#cbd5e1" data-i18n="auth.needaccount">Bạn cần tài khoản để đăng tin bán thiết bị.</p>
      <div class="flex gap-8 mt-8">
        <div><div class="stat-num text-white tabular">42K+</div><div class="text-sm" style="color:#94a3b8" data-i18n="hero.stat1">Tin đang đăng</div></div>
        <div><div class="stat-num text-white tabular">3.6K</div><div class="text-sm" style="color:#94a3b8" data-i18n="hero.stat2">Nhà cung cấp</div></div>
      </div>
    </div>
    <p class="relative text-sm" style="color:#64748b" data-i18n="foot.rights">© 2026 MayXayDung.</p>
  </div>

  <!-- form side -->
  <div class="flex flex-col items-center justify-center p-6 sm:p-12">
    <div class="w-full max-w-sm">
      <div class="flex items-center justify-between mb-8">
        <a href="index.html" class="lg:hidden brand-mark"><span class="brand-logo"><i data-lucide="hard-hat" class="w-5 h-5"></i></span>MayXayDung</a>
        <div class="lang-toggle ml-auto"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
      </div>

      <!-- tabs -->
      <div class="flex border-b border-slate-200 mb-6">
        <button id="tabLogin" class="flex-1 pb-3 font-semibold border-b-2 -mb-px" style="border-color:var(--accent);color:var(--steel-900)" data-i18n="auth.login">Đăng nhập</button>
        <button id="tabReg" class="flex-1 pb-3 font-semibold border-b-2 border-transparent muted" data-i18n="auth.register">Đăng ký</button>
      </div>

      <button class="btn btn-ghost btn-block mb-4">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38Z"/></svg>
        <span data-i18n="auth.google">Tiếp tục với Google</span>
      </button>

      <div class="flex items-center gap-3 my-4 text-xs muted"><span class="flex-1 h-px bg-slate-200"></span><span data-i18n="auth.or">hoặc</span><span class="flex-1 h-px bg-slate-200"></span></div>

      <form onsubmit="location.href='dashboard.html';return false">
        <div id="nameField" class="field-group hidden">
          <label class="label">Họ tên</label><input class="input" placeholder="Nguyễn Văn A">
        </div>
        <div class="field-group">
          <label class="label" data-i18n="auth.email">Email</label>
          <input type="email" class="input" placeholder="ban@congty.vn" autocomplete="email">
        </div>
        <div class="field-group">
          <label class="label" data-i18n="auth.password">Mật khẩu</label>
          <div class="relative">
            <input id="pw" type="password" class="input pr-10" placeholder="••••••••" autocomplete="current-password">
            <button type="button" onclick="const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400" aria-label="Show password"><i data-lucide="eye" class="w-4 h-4"></i></button>
          </div>
        </div>
        <div class="flex items-center justify-between text-sm mb-5">
          <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox"> <span data-i18n="auth.remember">Ghi nhớ đăng nhập</span></label>
          <a href="#" style="color:var(--accent-600)" data-i18n="auth.forgot">Quên mật khẩu?</a>
        </div>
        <button class="btn btn-accent btn-block btn-lg" id="submitBtn" data-i18n="auth.login">Đăng nhập</button>
      </form>

      <p class="text-center text-sm muted mt-6"><span data-i18n="auth.noaccount">Chưa có tài khoản?</span> <a href="#" id="switchReg" style="color:var(--accent-600);font-weight:600" data-i18n="auth.register">Đăng ký</a></p>
    </div>
  </div>
</div>

<script>
  lucide.createIcons();
  function setMode(reg){
    document.getElementById('nameField').classList.toggle('hidden',!reg);
    document.getElementById('tabReg').style.color = reg?'var(--steel-900)':'';
    document.getElementById('tabReg').style.borderColor = reg?'var(--accent)':'transparent';
    document.getElementById('tabReg').classList.toggle('muted',!reg);
    document.getElementById('tabLogin').style.color = reg?'':'var(--steel-900)';
    document.getElementById('tabLogin').style.borderColor = reg?'transparent':'var(--accent)';
    document.getElementById('tabLogin').classList.toggle('muted',reg);
    const dict=(typeof I18N!=='undefined'?I18N:{})[localStorage.getItem('mxd-lang')||'vi']||{};
    document.getElementById('submitBtn').textContent = reg?(dict['auth.register']||'Đăng ký'):(dict['auth.login']||'Đăng nhập');
  }
  document.getElementById('tabReg').onclick=()=>setMode(true);
  document.getElementById('tabLogin').onclick=()=>setMode(false);
  document.getElementById('switchReg').onclick=(e)=>{e.preventDefault();setMode(true);};
</script>
<script src="assets/app.js"></script>
</body>
</html>
