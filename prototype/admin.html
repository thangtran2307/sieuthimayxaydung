<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — MayXayDung</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background:var(--steel-100)">

<div class="grid lg:grid-cols-[240px_1fr] min-h-screen">
  <!-- ===== SIDEBAR ===== -->
  <aside class="hidden lg:flex flex-col" style="background:var(--steel-900);color:var(--steel-300)">
    <div class="p-5 flex items-center gap-2.5" style="border-bottom:1px solid rgba(255,255,255,.08)">
      <span class="brand-logo"><i data-lucide="hard-hat" class="w-5 h-5"></i></span>
      <div><div class="font-bold text-white" style="font-family:var(--font-display)">MayXayDung</div><div class="text-xs" style="color:var(--steel-500)" data-i18n="adm.title">Bảng quản trị</div></div>
    </div>
    <nav class="p-3 space-y-1 text-sm flex-1">
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-white" style="background:rgba(234,88,12,.15);color:#fdba74"><i data-lucide="clock" class="w-4 h-4"></i> <span data-i18n="adm.queue">Hàng chờ duyệt</span> <span class="ml-auto badge badge-pending">14</span></a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><i data-lucide="flag" class="w-4 h-4"></i> <span data-i18n="adm.reports">Tin bị báo cáo</span> <span class="ml-auto badge badge-rejected">5</span></a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><i data-lucide="list" class="w-4 h-4"></i> Tất cả tin đăng</a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><i data-lucide="users" class="w-4 h-4"></i> <span data-i18n="adm.users">Người dùng</span></a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><i data-lucide="badge-check" class="w-4 h-4"></i> Xác minh người bán</a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><i data-lucide="zap" class="w-4 h-4"></i> Quảng cáo & thanh toán</a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5"><i data-lucide="settings" class="w-4 h-4"></i> Cài đặt</a>
    </nav>
    <div class="p-3" style="border-top:1px solid rgba(255,255,255,.08)">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/5 text-sm"><i data-lucide="log-out" class="w-4 h-4"></i> Thoát</a>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <main>
    <div class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <button class="lg:hidden btn btn-ghost btn-sm"><i data-lucide="menu" class="w-5 h-5"></i></button>
        <h1 class="text-xl" data-i18n="adm.queue">Hàng chờ duyệt</h1>
      </div>
      <div class="flex items-center gap-3">
        <div class="lang-toggle"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
        <div class="w-9 h-9 rounded-full grid place-items-center text-white font-bold text-sm" style="background:var(--destructive)">AD</div>
      </div>
    </div>

    <div class="p-6">
      <!-- KPIs -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="stat-tile"><div class="text-sm muted flex items-center gap-2"><i data-lucide="clock" class="w-4 h-4" style="color:#b45309"></i><span data-i18n="adm.pending_total">Tin chờ duyệt</span></div><div class="stat-num tabular mt-1">14</div></div>
        <div class="stat-tile"><div class="text-sm muted flex items-center gap-2"><i data-lucide="flag" class="w-4 h-4" style="color:var(--destructive)"></i><span data-i18n="adm.reported_total">Tin bị báo cáo</span></div><div class="stat-num tabular mt-1">5</div></div>
        <div class="stat-tile"><div class="text-sm muted flex items-center gap-2"><i data-lucide="megaphone" class="w-4 h-4" style="color:#15803d"></i><span data-i18n="adm.live_total">Tin đang hiển thị</span></div><div class="stat-num tabular mt-1">42,180</div></div>
        <div class="stat-tile"><div class="text-sm muted flex items-center gap-2"><i data-lucide="users" class="w-4 h-4" style="color:var(--brand)"></i><span data-i18n="adm.users_total">Người dùng</span></div><div class="stat-num tabular mt-1">3,604</div></div>
      </div>

      <!-- moderation table -->
      <div class="card overflow-hidden">
        <div class="flex items-center justify-between p-4 border-b border-slate-200">
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-2 text-sm"><input type="checkbox"> Chọn tất cả</label>
          </div>
          <div class="flex items-center gap-2">
            <button class="btn btn-sm" style="background:#dcfce7;color:#15803d"><i data-lucide="check" class="w-3.5 h-3.5"></i> <span data-i18n="adm.approve">Duyệt</span></button>
            <button class="btn btn-sm" style="background:#fee2e2;color:#b91c1c"><i data-lucide="x" class="w-3.5 h-3.5"></i> <span data-i18n="adm.reject">Từ chối</span></button>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead><tr class="text-left muted" style="background:var(--steel-50)">
              <th class="p-3 w-8"></th><th class="p-3 font-semibold">Tin đăng</th><th class="p-3 font-semibold">Người bán</th>
              <th class="p-3 font-semibold">Danh mục</th><th class="p-3 font-semibold">Gửi lúc</th><th class="p-3 font-semibold text-right">Thao tác</th>
            </tr></thead>
            <tbody id="modrows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/listings-data.js"></script>
<script>
  const cats=['Máy đào','Xe nâng','Cần cẩu','Máy trộn','Phụ tùng','Máy làm đường'];
  const flagged=[false,true,false,false,true,false];
  const rows = LISTINGS.slice(0,6).map((l,i)=>`<tr class="border-t border-slate-100 hover:bg-slate-50">
    <td class="p-3"><input type="checkbox"></td>
    <td class="p-3"><div class="flex items-center gap-3"><img src="${l.img}" class="w-14 h-11 rounded object-cover">
      <div><div class="font-medium text-slate-800 max-w-[220px] truncate">${l.title}</div>
      ${flagged[i]?'<span class="badge badge-rejected mt-0.5"><i data-lucide=\"flag\" class=\"w-3 h-3\"></i> Bị báo cáo</span>':'<span class="badge badge-pending mt-0.5">Chờ duyệt</span>'}</div></div></td>
    <td class="p-3">Tân Minh #${1000+i}</td>
    <td class="p-3 muted">${cats[i]}</td>
    <td class="p-3 muted">${l.time}</td>
    <td class="p-3"><div class="flex items-center justify-end gap-1.5">
      <a href="product.html" class="btn btn-ghost btn-sm" title="Xem"><i data-lucide="eye" class="w-3.5 h-3.5"></i></a>
      <button class="btn btn-sm" style="background:#dcfce7;color:#15803d" title="Duyệt"><i data-lucide="check" class="w-3.5 h-3.5"></i></button>
      <button class="btn btn-sm" style="background:#fef3c7;color:#b45309" title="Từ chối"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
      <button class="btn btn-sm" style="background:#fee2e2;color:#b91c1c" title="Xoá"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
    </div></td></tr>`).join('');
  document.getElementById('modrows').innerHTML=rows;
  lucide.createIcons();
</script>
<script src="assets/app.js"></script>
</body>
</html>
